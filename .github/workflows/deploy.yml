# 약관을 굽고 GitHub Pages로 올린다.

name: deploy

on:
  push:
    branches: [main]
  # 시행일이 오면 스스로 현행이 되어야 한다 — 그런데 정적 사이트는 아무도 굽지 않으면
  # 어제의 판본을 계속 내보낸다. 그래서 한국 시각 0시 5분에 매일 한 번 다시 굽는다.
  # (GitHub의 cron 은 UTC다. 15:05 UTC = 00:05 KST)
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 밀린 것은 마지막 것만 살린다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
